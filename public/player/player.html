<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e5a32">
  <title>RADIO MERCADO DON MANUEL</title>
  <link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/assets/fonts/poppins.css">
  <link rel="stylesheet" href="/static/player/player.css">
</head>
<body>
  <video id="live" playsinline webkit-playsinline autoplay muted></video>

  <!-- Respaldo local: solo se usa cuando no hay señal central y el navegador lo permite -->
  <div id="backup" class="hidden">
    <video id="bvideo" playsinline webkit-playsinline muted></video>
    <audio id="baudio"></audio>
  </div>

  <!-- Pantalla de espera -->
  <div id="wait" class="screen">
    <video class="wait-bg" autoplay muted loop playsinline webkit-playsinline poster="/static/assets/fondo.jpg"><source src="/static/assets/fondo.mp4" type="video/mp4"></video>
    <div class="wait-box">
      <div class="wait-logo"><img src="/static/assets/logo-don-manuel.png" alt="Mercados Don Manuel"></div>
      <div class="wait-name">RADIO MERCADO</div>
      <div id="waitMsg" class="wait-msg">Conectando con la señal…</div>
      <div id="waitSub" class="wait-sub"></div>
      <div id="clock" class="wait-clock"></div>
    </div>
  </div>

  <!-- Activación de sonido cuando el navegador bloquea la reproducción automática -->
  <div id="unmute" class="screen hidden">
    <button id="unmuteBtn" class="unmute-btn" type="button">
      <span class="big">Pulse OK para activar el sonido</span>
      <span class="small">El navegador de este televisor exige una pulsación para reproducir audio.</span>
    </button>
  </div>

  <!-- Botón de pantalla completa / pantalla normal (aparece al mover el mouse o tocar la pantalla) -->
  <button id="fsBtn" class="fs-btn" type="button" title="Pantalla completa" aria-label="Pantalla completa">
    <svg id="fsIn" viewBox="0 0 24 24" width="100%" height="100%"><path fill="#fff" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
    <svg id="fsOut" viewBox="0 0 24 24" width="100%" height="100%" style="display:none"><path fill="#fff" d="M8 4h2v6H4V8h4V4zm6 0h2v4h4v2h-6V4zM4 14h6v6H8v-4H4v-2zm10 0h6v2h-4v4h-2v-6z"/></svg>
  </button>

  <div id="badge" class="badge" aria-live="polite"><span class="dot"></span><span id="badgeText"></span></div>
  <script src="/static/vendor/hls.min.js"></script>
  <script src="/static/player/player.js"></script>
</body>
</html>
